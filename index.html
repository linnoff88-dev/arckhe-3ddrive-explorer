<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Print Library - Drive Explorer</title>
  <meta name="description" content="Explore e baixe modelos 3D do acervo INEMA">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #030712;
      color: #f3f4f6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

    /* Loading */
    .loading {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    .loading .icon { font-size: 2.5rem; animation: pulse 2s infinite; }
    .loading p { color: #6b7280; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .error-msg {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #f87171;
    }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid #1f2937; padding: 16px;
    }
    .header-inner { max-width: 80rem; margin: 0 auto; }
    .header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .header-title {
      font-size: 1.25rem; font-weight: 700; color: #fff;
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .header-title .title-text { display: none; }
    @media (min-width: 640px) { .header-title .title-text { display: inline; } }

    .search-wrap { flex: 1; position: relative; }
    .search-input {
      width: 100%; background: #111827; border: 1px solid #1f2937;
      border-radius: 8px; padding: 8px 16px; font-size: 0.875rem;
      color: #e5e7eb; outline: none; transition: border-color 0.2s;
    }
    .search-input::placeholder { color: #4b5563; }
    .search-input:focus { border-color: #0e7490; }
    .search-clear {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: #4b5563; font-size: 0.875rem; padding: 4px;
    }
    .search-clear:hover { color: #d1d5db; }

    .header-meta { display: none; align-items: center; gap: 12px; font-size: 0.75rem; color: #6b7280; }
    .header-meta .sep { color: #374151; }
    @media (min-width: 768px) { .header-meta { display: flex; } }

    /* Category Filter */
    .cat-filter { display: flex; flex-wrap: wrap; gap: 8px; }
    .cat-btn {
      padding: 6px 12px; font-size: 0.75rem; border-radius: 9999px;
      border: 1px solid #1f2937; background: #111827; color: #6b7280;
      font-weight: 500; transition: all 0.2s;
    }
    .cat-btn:hover { color: #d1d5db; }
    .cat-btn.active {
      border-color: #0e7490; background: rgba(8, 145, 178, 0.2); color: #67e8f9;
    }

    /* Main */
    main { max-width: 80rem; margin: 0 auto; padding: 24px 16px; }

    /* Stats */
    .stats-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; margin-bottom: 24px;
    }
    @media (min-width: 640px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .stats-grid { grid-template-columns: repeat(6, 1fr); } }
    .stat-card {
      background: #111827; border: 1px solid #1f2937;
      border-radius: 12px; padding: 16px; text-align: center;
    }
    .stat-icon { font-size: 1.5rem; margin-bottom: 4px; }
    .stat-label { font-size: 0.875rem; font-weight: 600; }
    .stat-count { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .stat-size { font-size: 0.75rem; color: #6b7280; }

    .color-cyan { color: #22d3ee; }
    .color-amber { color: #fbbf24; }
    .color-pink { color: #f472b6; }
    .color-purple { color: #a78bfa; }
    .color-green { color: #4ade80; }
    .color-gray { color: #9ca3af; }

    /* Breadcrumbs */
    .breadcrumbs {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.875rem; margin-bottom: 16px; flex-wrap: wrap;
    }
    .breadcrumbs .sep { color: #4b5563; margin: 0 4px; }
    .bread-btn {
      padding: 2px 8px; border-radius: 4px; transition: all 0.2s;
      color: #9ca3af;
    }
    .bread-btn:hover { color: #fff; background: rgba(31, 41, 55, 0.5); }
    .bread-btn.current { background: #1f2937; color: #fff; font-weight: 600; }

    /* Folder header */
    .folder-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .folder-header h2 { font-size: 1.125rem; font-weight: 600; color: #fff; }
    .drive-link {
      font-size: 0.75rem; background: #1f2937; color: #9ca3af;
      padding: 4px 12px; border-radius: 9999px; transition: all 0.2s;
    }
    .drive-link:hover { background: #374151; color: #fff; }
    .folder-meta { font-size: 0.75rem; color: #4b5563; }

    /* Section heading */
    .section-title {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: #4b5563; margin-bottom: 12px; font-weight: 600;
    }

    /* Folder grid */
    .folders-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 12px; margin-bottom: 24px;
    }
    @media (min-width: 640px) { .folders-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .folders-grid { grid-template-columns: repeat(3, 1fr); } }

    .folder-card {
      background: #111827; border: 1px solid #1f2937;
      border-radius: 12px; padding: 16px; text-align: left;
      transition: all 0.2s; width: 100;
    }
    .folder-card:hover { border-color: #4b5563; background: rgba(31, 41, 55, 0.6); }
    .folder-inner { display: flex; align-items: flex-start; gap: 12px; }
    .folder-thumb {
      width: 64px; height: 64px; border-radius: 8px;
      object-fit: cover; background: #1f2937; flex-shrink: 0;
    }
    .folder-icon-placeholder {
      width: 64px; height: 64px; border-radius: 8px;
      background: #1f2937; display: flex; align-items: center;
      justify-content: center; font-size: 1.5rem; flex-shrink: 0;
    }
    .folder-info { min-width: 0; flex: 1; }
    .folder-name {
      font-weight: 600; color: #fff; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; transition: color 0.2s;
    }
    .folder-card:hover .folder-name { color: #22d3ee; }
    .folder-count { font-size: 0.75rem; color: #6b7280; margin-top: 4px; }
    .folder-size { font-size: 0.75rem; color: #4b5563; }
    .folder-arrow { color: #4b5563; font-size: 1.125rem; }
    .folder-card:hover .folder-arrow { color: #9ca3af; }

    /* Files list */
    .files-list { display: flex; flex-direction: column; gap: 6px; }
    .file-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: #111827; border: 1px solid #1f2937;
      border-radius: 8px; transition: border-color 0.2s;
    }
    .file-row:hover { border-color: #374151; }
    .file-icon { font-size: 1.125rem; flex-shrink: 0; }
    .file-info { min-width: 0; flex: 1; }
    .file-name {
      font-size: 0.875rem; color: #e5e7eb;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-size { font-size: 0.75rem; color: #4b5563; }
    .file-path { font-size: 10px; color: #4b5563; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-ext {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
      color: #4b5563; background: #1f2937; padding: 2px 8px;
      border-radius: 4px; font-family: monospace;
    }
    .file-actions {
      display: flex; align-items: center; gap: 4px;
      opacity: 0; transition: opacity 0.2s;
    }
    .file-row:hover .file-actions { opacity: 1; }
    .action-btn {
      padding: 4px 8px; font-size: 0.75rem; border-radius: 4px;
      transition: background 0.2s; display: inline-block;
    }
    .action-view { background: #1f2937; color: #d1d5db; }
    .action-view:hover { background: #374151; }
    .action-dl { background: rgba(8, 145, 178, 0.2); color: #22d3ee; }
    .action-dl:hover { background: rgba(8, 145, 178, 0.35); }

    /* Search results */
    .search-meta { font-size: 0.875rem; color: #6b7280; margin-bottom: 12px; }

    /* Empty */
    .empty-state {
      text-align: center; padding: 64px 0; color: #4b5563;
    }
    .empty-state .icon { font-size: 2rem; margin-bottom: 12px; }
  </style>
</head>
<body>

<div id="app">
  <div class="loading">
    <div class="icon">🧊</div>
    <p>Carregando acervo 3D...</p>
  </div>
</div>

<script>
(function() {
  // --- Utils ---
  const CATEGORY_META = {
    model:    { label: 'Modelos 3D',  icon: '🧊', color: 'color-cyan' },
    archive:  { label: 'Compactados', icon: '📦', color: 'color-amber' },
    image:    { label: 'Imagens',     icon: '🖼️', color: 'color-pink' },
    video:    { label: 'Videos',      icon: '🎬', color: 'color-purple' },
    document: { label: 'Documentos',  icon: '📄', color: 'color-green' },
    other:    { label: 'Outros',      icon: '📎', color: 'color-gray' },
  };
  const ALL_CATS = ['model', 'archive', 'image', 'document', 'video', 'other'];

  const EXT_ICONS = {
    stl: '🧊', '3mf': '🧊', blend: '🎨', obj: '🧊', fbx: '🧊',
    zip: '📦', rar: '📦', '7z': '📦',
    jpg: '🖼️', jpeg: '🖼️', png: '🖼️', webp: '🖼️',
    pdf: '📄', mp4: '🎬', txt: '📝',
  };

  function catMeta(cat) { return CATEGORY_META[cat] || CATEGORY_META.other; }
  function extIcon(ext) { return EXT_ICONS[ext] || '📎'; }
  function dlUrl(id) { return 'https://drive.google.com/uc?export=download&id=' + id; }
  function viewUrl(id) { return 'https://drive.google.com/file/d/' + id + '/view'; }
  function folderUrl(id) { return 'https://drive.google.com/drive/folders/' + id; }
  function thumbUrl(id) { return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w400'; }
  function fmt(n) { return n.toLocaleString('pt-BR'); }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  // --- State ---
  var data = null;
  var navPath = [];
  var activeFilters = new Set(ALL_CATS);
  var searchQuery = '';

  // --- Render ---
  function render() {
    var app = document.getElementById('app');
    if (!data) { app.innerHTML = '<div class="error-msg">Erro ao carregar dados.</div>'; return; }

    var currentFolder = navPath[navPath.length - 1];
    var isSearching = searchQuery.length >= 2;

    var html = '';

    // Header
    html += '<header><div class="header-inner">';
    html += '<div class="header-top">';
    html += '<h1 class="header-title">🧊 <span class="title-text">3D Print Library</span></h1>';
    html += '<div class="search-wrap">';
    html += '<input type="text" class="search-input" id="searchInput" placeholder="Buscar arquivos..." value="' + esc(searchQuery) + '">';
    if (searchQuery) html += '<button class="search-clear" id="clearSearch">x</button>';
    html += '</div>';
    html += '<div class="header-meta"><span>' + fmt(data.totalFiles) + ' arquivos</span><span class="sep">|</span><span>' + esc(data.totalSizeLabel) + '</span></div>';
    html += '</div>';

    // Category filter
    html += '<div class="cat-filter">';
    ALL_CATS.forEach(function(cat) {
      var m = catMeta(cat);
      var cls = activeFilters.has(cat) ? 'cat-btn active' : 'cat-btn';
      html += '<button class="' + cls + '" data-cat="' + cat + '">' + m.icon + ' ' + m.label + '</button>';
    });
    html += '</div>';
    html += '</div></header>';

    // Main
    html += '<main>';

    // Stats
    html += '<div class="stats-grid">';
    var cats = Object.entries(data.stats).sort(function(a, b) { return b[1].count - a[1].count; });
    cats.forEach(function(entry) {
      var cat = entry[0], s = entry[1];
      var m = catMeta(cat);
      html += '<div class="stat-card">';
      html += '<div class="stat-icon">' + m.icon + '</div>';
      html += '<div class="stat-label ' + m.color + '">' + m.label + '</div>';
      html += '<div class="stat-count">' + fmt(s.count) + '</div>';
      html += '<div class="stat-size">' + esc(s.sizeLabel) + '</div>';
      html += '</div>';
    });
    html += '</div>';

    if (isSearching) {
      // Search results
      var q = searchQuery.toLowerCase();
      var results = data.searchIndex.filter(function(f) {
        return activeFilters.has(f.category) &&
          (f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q));
      });
      html += '<p class="search-meta">' + fmt(results.length) + ' resultados para "' + esc(searchQuery) + '"';
      if (results.length > 100) html += ' (mostrando 100)';
      html += '</p>';
      html += '<div class="files-list">';
      results.slice(0, 100).forEach(function(f) {
        html += '<div class="file-row">';
        html += '<span class="file-icon">' + extIcon(f.ext) + '</span>';
        html += '<div class="file-info"><p class="file-name">' + esc(f.name) + '</p><p class="file-path">' + esc(f.path) + '</p></div>';
        html += '<span class="file-ext">' + esc(f.ext || '?') + '</span>';
        html += '<div class="file-actions">';
        html += '<a href="' + viewUrl(f.id) + '" target="_blank" rel="noopener noreferrer" class="action-btn action-view" title="Ver">👁</a>';
        html += '<a href="' + dlUrl(f.id) + '" target="_blank" rel="noopener noreferrer" class="action-btn action-dl" title="Baixar">⬇</a>';
        html += '</div></div>';
      });
      html += '</div>';
    } else {
      // Breadcrumbs
      html += '<nav class="breadcrumbs">';
      navPath.forEach(function(folder, i) {
        if (i > 0) html += '<span class="sep">/</span>';
        var cls = i === navPath.length - 1 ? 'bread-btn current' : 'bread-btn';
        html += '<button class="' + cls + '" data-nav="' + i + '">' + (i === 0 ? '🏠 Inicio' : esc(folder.name)) + '</button>';
      });
      html += '</nav>';

      // Folder header
      if (navPath.length > 1 && currentFolder) {
        html += '<div class="folder-header">';
        html += '<h2>' + esc(currentFolder.name) + '</h2>';
        html += '<a href="' + folderUrl(currentFolder.id) + '" target="_blank" rel="noopener noreferrer" class="drive-link">Abrir no Drive ↗</a>';
        html += '<span class="folder-meta">' + currentFolder.fileCount + ' arquivos / ' + esc(currentFolder.totalSizeLabel) + '</span>';
        html += '</div>';
      }

      // Separate children
      var folders = [], files = [];
      if (currentFolder) {
        currentFolder.children.forEach(function(child) {
          if (child.type === 'folder') folders.push(child);
          else if (activeFilters.has(child.category)) files.push(child);
        });
        folders.sort(function(a, b) { return b.fileCount - a.fileCount; });
        files.sort(function(a, b) { return a.name.localeCompare(b.name); });
      }

      if (folders.length > 0) {
        html += '<div style="margin-bottom:24px">';
        html += '<h3 class="section-title">Pastas (' + folders.length + ')</h3>';
        html += '<div class="folders-grid">';
        folders.forEach(function(f) {
          html += '<button class="folder-card" data-folder="' + esc(f.id) + '">';
          html += '<div class="folder-inner">';
          if (f.thumbnail) {
            html += '<img src="' + thumbUrl(f.thumbnail) + '" alt="" class="folder-thumb" loading="lazy">';
          } else {
            html += '<div class="folder-icon-placeholder">📁</div>';
          }
          html += '<div class="folder-info">';
          html += '<div class="folder-name">' + esc(f.name) + '</div>';
          html += '<p class="folder-count">' + fmt(f.fileCount) + ' arquivos</p>';
          html += '<p class="folder-size">' + esc(f.totalSizeLabel) + '</p>';
          html += '</div>';
          html += '<span class="folder-arrow">&#8250;</span>';
          html += '</div></button>';
        });
        html += '</div></div>';
      }

      if (files.length > 0) {
        html += '<div>';
        html += '<h3 class="section-title">Arquivos (' + files.length + ')</h3>';
        html += '<div class="files-list">';
        files.forEach(function(f) {
          html += '<div class="file-row">';
          html += '<span class="file-icon">' + extIcon(f.ext) + '</span>';
          html += '<div class="file-info"><p class="file-name">' + esc(f.name) + '</p><p class="file-size">' + esc(f.sizeLabel) + '</p></div>';
          html += '<span class="file-ext">' + esc(f.ext || '?') + '</span>';
          html += '<div class="file-actions">';
          html += '<a href="' + viewUrl(f.id) + '" target="_blank" rel="noopener noreferrer" class="action-btn action-view" title="Visualizar no Drive">👁</a>';
          html += '<a href="' + dlUrl(f.id) + '" target="_blank" rel="noopener noreferrer" class="action-btn action-dl" title="Baixar">⬇</a>';
          html += '</div></div>';
        });
        html += '</div></div>';
      }

      if (folders.length === 0 && files.length === 0) {
        html += '<div class="empty-state"><div class="icon">📂</div><p>Pasta vazia</p></div>';
      }
    }

    html += '</main>';
    app.innerHTML = html;
    bindEvents();
  }

  // --- Events ---
  function findFolderById(folder, id) {
    if (folder.id === id) return folder;
    if (!folder.children) return null;
    for (var i = 0; i < folder.children.length; i++) {
      if (folder.children[i].type === 'folder') {
        if (folder.children[i].id === id) return folder.children[i];
      }
    }
    return null;
  }

  function bindEvents() {
    var input = document.getElementById('searchInput');
    if (input) {
      input.addEventListener('input', function(e) {
        searchQuery = e.target.value;
        render();
        // Re-focus and set cursor position
        var newInput = document.getElementById('searchInput');
        if (newInput) { newInput.focus(); newInput.setSelectionRange(newInput.value.length, newInput.value.length); }
      });
    }

    var clearBtn = document.getElementById('clearSearch');
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        searchQuery = '';
        render();
        var newInput = document.getElementById('searchInput');
        if (newInput) newInput.focus();
      });
    }

    // Category filter
    document.querySelectorAll('[data-cat]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var cat = this.getAttribute('data-cat');
        if (activeFilters.has(cat)) activeFilters.delete(cat);
        else activeFilters.add(cat);
        render();
      });
    });

    // Breadcrumbs
    document.querySelectorAll('[data-nav]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var i = parseInt(this.getAttribute('data-nav'));
        navPath = navPath.slice(0, i + 1);
        render();
      });
    });

    // Folder cards
    document.querySelectorAll('[data-folder]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = this.getAttribute('data-folder');
        var currentFolder = navPath[navPath.length - 1];
        var target = findFolderById(currentFolder, id);
        if (target) {
          navPath.push(target);
          render();
          window.scrollTo(0, 0);
        }
      });
    });
  }

  // --- Init ---
  // Detect base path for GitHub Pages
  var basePath = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
  fetch(basePath + 'public/data.json')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      data = d;
      navPath = [d.tree];
      render();
    })
    .catch(function(e) {
      console.error('Failed to load data:', e);
      document.getElementById('app').innerHTML = '<div class="error-msg">Erro ao carregar dados. Verifique se public/data.json existe.</div>';
    });
})();
</script>
</body>
</html>
